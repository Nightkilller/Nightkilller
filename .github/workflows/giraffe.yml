name: GitHub Giraffe

on:
  schedule:
    # Runs daily at midnight UTC
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/generate_giraffe.py
      - .github/workflows/giraffe.yml

permissions:
  contents: write

concurrency: giraffe

jobs:
  giraffe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pillow requests

      - name: Generate Giraffe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_giraffe.py giraffe/giraffe.gif

      - name: Commit Giraffe if changed
        shell: bash
        run: |
          git add giraffe/giraffe.gif
          if git diff --cached --quiet; then
            echo "The giraffe is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "giraffe: update neck growth and language spots"
          git push --quiet
